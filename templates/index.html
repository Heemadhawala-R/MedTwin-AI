<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MedTwin-AI · Patient Risk Prediction</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:#060b14; --surface:#0d1626; --card:#0f1c2e;
      --border:rgba(0,200,255,0.12); --accent:#00c8ff; --accent2:#00ffb2;
      --warn:#ffb347; --danger:#ff5e6c; --text:#dbeafe; --muted:#4a6080;
    }

    body {
      font-family: 'Instrument Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }

    .wrapper { width: 100%; max-width: 500px; }

    /* Header */
    .brand-row {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:2rem;
    }

    .brand { display:flex; align-items:center; gap:12px; }

    .brand-name {
      font-family:'Syne',sans-serif;
      font-size:1.7rem;
      font-weight:800;
      background:linear-gradient(100deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .acc-badge {
      background:rgba(0,255,178,.1);
      border:1px solid rgba(0,255,178,.2);
      border-radius:10px;
      padding:6px 12px;
      text-align:center;
    }

    .acc-val {
      font-weight:800;
      color:var(--accent2);
    }

    /* Card */
    .card {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      padding:2rem;
    }

    .card-title {
      font-family:'Syne',sans-serif;
      margin-bottom:10px;
    }

    .card-desc {
      font-size:0.9rem;
      color:var(--muted);
      margin-bottom:20px;
    }

    .field { margin-bottom:15px; }

    input {
      width:100%;
      padding:10px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--surface);
      color:white;
    }

    button {
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      background:linear-gradient(120deg,var(--accent),var(--accent2));
      color:black;
      font-weight:bold;
      cursor:pointer;
    }

    .stats {
      display:flex;
      justify-content:center;
      gap:10px;
      margin-top:20px;
    }

    .stat-pill {
      padding:5px 10px;
      border-radius:20px;
      border:1px solid var(--border);
      font-size:12px;
    }

    .disclaimer {
      text-align:center;
      font-size:12px;
      margin-top:10px;
      color:var(--muted);
    }

  </style>
</head>

<body>

<div class="wrapper">

  <div class="brand-row">
    <div class="brand">
      <div class="brand-name">MedTwin-AI</div>
    </div>

    <div class="acc-badge">
      <div class="acc-val">{{ accuracy }}%</div>
      <div style="font-size:10px;">Accuracy</div>
    </div>
  </div>

  <div class="card">
    <h2 class="card-title">Patient Health Assessment</h2>
    <p class="card-desc">Enter your vitals to predict health risk</p>

    <form action="/predict" method="POST">

      <div class="field">
        <input type="number" name="age" placeholder="Age" required>
      </div>

      <div class="field">
        <input type="number" name="heart_rate" placeholder="Heart Rate" required>
      </div>

      <div class="field">
        <input type="number" name="systolic_bp" placeholder="Systolic BP" required>
      </div>

      <div class="field">
        <input type="number" name="oxygen_level" placeholder="Oxygen %" required>
      </div>

      <div class="field">
        <input type="number" name="blood_sugar" placeholder="Blood Sugar" required>
      </div>

      <button type="submit">Analyse Health Risk</button>

    </form>
  </div>

  <div class="stats">
    <div class="stat-pill">ML Powered</div>
    <div class="stat-pill">5 Vitals</div>
    <div class="stat-pill">Real-time</div>
  </div>

  <div class="disclaimer">
    ⚠ Educational use only
  </div>

</div>

</body>
</html>
